# ============================================
#         ПРОДАКШЕН КОНФИГ ЛОГИСТИКИ
# ============================================

server.port=8080

spring.datasource.url=jdbc:postgresql://postgres-logistics:5432/logistics_db
spring.datasource.username=logistics_user
spring.datasource.password=${LOGISTICS_DB_PASSWORD:logistics_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# === ДИСПЕТЧЕРИЗАЦИЯ ===
dispatch.system.url=http://host.docker.internal:8081
dispatch.system.username=admin
dispatch.system.password=${DISPATCH_SYSTEM_PASSWORD:admin123}

sync.send.interval=60000
sync.send.enabled=true
sync.receive.interval=60000
sync.receive.enabled=true

logging.level.org.example=DEBUG
