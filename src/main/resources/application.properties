# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/logistics_db
spring.datasource.username=logistics_user
spring.datasource.password=logistics_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080
server.servlet.session.timeout=30m

# Logging
logging.level.com.logistic.test=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.example.service=DEBUG

# Dispatch System Integration
dispatch.system.url=http://localhost:8081
dispatch.system.username=admin
dispatch.system.password=admin123

# Sync Send Configuration
sync.send.interval=60000
sync.send.enabled=true
sync.send.batch.size=10

# Sync Receive Configuration
sync.receive.interval=60000
sync.receive.enabled=true

# 1C Integration Settings
# Request Auto-Processing Settings
request.auto.process.enabled=true
request.auto.process.delay.hours=24

# Request Auto-Completion Settings
request.auto.complete.enabled=true
request.auto.complete.delay.hours=48